name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: ThroneCore AAR and schema
        uses: ./.github/actions/throne-core

      - name: Fetch routeprofiles snapshot
        uses: ./.github/actions/routeprofiles

      - name: Fetch sing-box dashboard
        uses: ./.github/actions/sing-box-dashboard

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        run: |
          ./gradlew --stacktrace :app:assembleOssRelease

      - name: Prepare Single APK
        id: prepare
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found in app/build/outputs/apk"
            exit 1
          fi
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          TARGET_NAME="Throne-v${VERSION_NAME}.apk"
          cp "$APK_FILE" "dist/$TARGET_NAME"
          echo "Package created: dist/$TARGET_NAME"
          ls -la dist/
          TAG="v${VERSION_NAME}-live-update-$(date +'%Y%m%d%H%M')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ThroneForAndroid-APK
          path: ${{ steps.prepare.outputs.apk_path }}
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          APK_PATH: ${{ steps.prepare.outputs.apk_path }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_TITLE="Throne for Android v$VERSION (Live Update 实况通知岛版本)"
          RELEASE_BODY="### Throne for Android v$VERSION - Live Update 实况通知岛版本

          新增功能：**Live Update（实况通知岛/灵动岛）**
          - **自由开关**：可在「设置」➔「外观」➔「通知」自由开启和关闭。
          - **完全自定义内容**：支持模板预设以及完全自定义文本与动态变量（如 \`{profile}\`, \`{down}\`, \`{up}\`, \`{traffic_total}\`, \`{duration}\` 等）。
          - **多系统适配**：适配 Android 16 原生 Live Updates 胶囊及各大厂商系统实况通知/焦点通知协议。

          下方已附加打包生成的单体 APK 安装包，下载即可直接安装使用。"

          gh release create "$TAG" "$APK_PATH" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$RELEASE_BODY"
