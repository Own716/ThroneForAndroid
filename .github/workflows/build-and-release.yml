name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: ThroneCore AAR and schema
        uses: ./.github/actions/throne-core

      - name: Fetch routeprofiles snapshot
        uses: ./.github/actions/routeprofiles

      - name: Fetch sing-box dashboard
        uses: ./.github/actions/sing-box-dashboard

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APKs
        run: |
          ./gradlew --stacktrace :app:assembleOssRelease

      - name: Collect Release Assets
        id: collect
        run: |
          python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist preview
          ls -la dist/
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          TAG="v${VERSION_NAME}-live-update-$(date +'%Y%m%d%H%M')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ThroneForAndroid-LiveUpdate-APKs
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.collect.outputs.tag }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="### Throne for Android - Live Update（实况通知岛）定制构建版本

          基于 Throne $VERSION 构建，新增 **Live Update（实况通知岛/灵动岛）** 功能特性：
          - **自由开关**：前往「设置」➔「外观」➔「通知」自由开启/关闭。
          - **完全自定义内容**：支持模板预设（标准、极简、全能）及完全自定义语法（\`{profile}\`, \`{down}\`, \`{up}\`, \`{traffic_total}\`, \`{duration}\` 等变量）。
          - **全平台动态岛适配**：支持 Android 16+ 原生 Live Updates（Promoted Ongoing Notifications）状态栏芯片，以及小米 HyperOS（焦点通知/超级岛）参数。

          #### 安装说明
          - 请下载下方适合您机型架构的 APK（现代手机绝大多数为 \`arm64-v8a\`）。"

          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes "$RELEASE_NOTES"
